[project]
name = "inclusiva-edu"
version = "0.1.0"
description = "Transcripción en vivo para estudiantes sordos, con pantalla de proyector, sesiones guardadas y actividades."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.11",
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "faster-whisper>=1.2",
    "google-cloud-speech>=2.40",
    "ollama>=0.6",
    "pydantic>=2.13",
    "python-docx>=1.2",
    "fpdf2>=2.8",
]

[project.scripts]
inclusiva = "inclusiva.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusiva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
